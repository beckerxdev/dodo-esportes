<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow">
    <title>Painel | Dodô Esportes</title>
    <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;800&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
      :root {
        --navy: #0a1640;
        --blue: #2a52e8;
        --bg: #eef1f7;
        --line: #dde2f0;
        --mut: #5d6684;
      }
      * {
        box-sizing: border-box;
        margin: 0;
      }
      body {
        font: 15px/1.5 Barlow, sans-serif;
        background: var(--bg);
        color: #101528;
      }
      h1,
      h2,
      h3 {
        font-family: "Barlow Condensed";
        font-weight: 800;
        text-transform: uppercase;
      }
      button,
      input,
      select,
      textarea {
        font: inherit;
      }
      :focus-visible {
        outline: 3px solid var(--blue);
        outline-offset: 2px;
      }
      header {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        height: 60px;
        background: var(--navy);
        color: #fff;
        display: flex;
        align-items: center;
        gap: 14px;
        padding: 0 16px;
        z-index: 40;
      }
      header h3 {
        font-size: 24px;
        flex: 1;
      }
      header span {
        font-size: 13px;
        opacity: .8;
      }
      .ib {
        background: none;
        border: 0;
        color: #fff;
        font-size: 24px;
        padding: 6px 10px;
        border-radius: 8px;
        position: relative;
      }
      .ib:hover {
        background: rgba(255, 255, 255, .12);
      }
      .bd {
        position: absolute;
        top: 0;
        right: 0;
        background: #ff6a1a;
        font-size: 11px;
        border-radius: 99px;
        padding: 0 6px;
      }
      aside {
        position: fixed;
        top: 60px;
        bottom: 0;
        left: 0;
        width: 250px;
        background: #fff;
        border-right: 1px solid var(--line);
        transform: translateX(-100%);
        transition: transform .3s;
        z-index: 35;
        padding: 14px;
      }
      aside.open {
        transform: none;
      }
      aside button {
        display: block;
        width: 100%;
        text-align: left;
        padding: 12px 14px;
        border: 0;
        background: none;
        border-radius: 10px;
        font-weight: 600;
      }
      aside button:hover,
      aside button.on {
        background: #e7ecff;
        color: var(--blue);
      }
      #ov {
        position: fixed;
        inset: 60px 0 0;
        background: rgba(10, 22, 64, .4);
        z-index: 30;
        display: none;
      }
      #ov.show {
        display: block;
      }
      main {
        padding: 84px 20px 40px;
        max-width: 1150px;
        margin: auto;
      }
      .cards {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
        gap: 14px;
        margin: 16px 0;
      }
      .k {
        background: #fff;
        border-radius: 14px;
        padding: 16px;
        border: 1px solid var(--line);
      }
      .k b {
        font: 800 38px "Barlow Condensed";
        color: var(--blue);
        display: block;
      }
      .panel {
        background: #fff;
        border-radius: 14px;
        padding: 18px;
        border: 1px solid var(--line);
        margin-bottom: 16px;
        overflow-x: auto;
      }
      .two {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 16px;
      }
      .bar {
        display: flex;
        align-items: center;
        gap: 10px;
        margin: 6px 0;
      }
      .bar i {
        display: block;
        height: 14px;
        background: var(--blue);
        border-radius: 7px;
        transition: width .6s;
      }
      table {
        width: 100%;
        border-collapse: collapse;
      }
      td,
      th {
        padding: 9px 8px;
        text-align: left;
        border-bottom: 1px solid var(--line);
        vertical-align: middle;
      }
      th {
        font-size: 12px;
        color: var(--mut);
      }
      .btn {
        background: var(--blue);
        color: #fff;
        border: 0;
        border-radius: 10px;
        padding: 10px 18px;
        font-weight: 600;
        text-decoration: none;
        display: inline-block;
      }
      .btn.s {
        background: #e7ecff;
        color: var(--blue);
      }
      .btn.d {
        background: #fde8e6;
        color: #c0392b;
      }
      input,
      select,
      textarea {
        width: 100%;
        padding: 10px 12px;
        border: 1px solid #cdd4ea;
        border-radius: 10px;
        background: #fff;
      }
      label {
        display: block;
        font-weight: 600;
        margin: 10px 0 4px;
      }
      .g {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 0 16px;
      }
      .st {
        padding: 3px 10px;
        border-radius: 99px;
        font-size: 12px;
        font-weight: 700;
      }
      .st.ok {
        background: #dcf5e5;
        color: #0a7a35;
      }
      .st.lo {
        background: #fff1d6;
        color: #9a6200;
      }
      .st.no {
        background: #fde8e6;
        color: #c0392b;
      }
      .st.off {
        background: #e5e8f2;
        color: #555;
      }
      .vr {
        display: grid;
        grid-template-columns: 1fr 1fr 90px 40px;
        gap: 8px;
        margin-bottom: 8px;
      }
      .imgs {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        margin: 8px 0;
      }
      .imgs div {
        position: relative;
      }
      .imgs img {
        width: 80px;
        height: 80px;
        object-fit: cover;
        border-radius: 8px;
      }
      .imgs .rmv {
        opacity: .3;
      }
      #toast {
        position: fixed;
        bottom: 20px;
        right: 20px;
        padding: 12px 18px;
        border-radius: 10px;
        color: #fff;
        z-index: 99;
        display: none;
      }
      #login {
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: var(--navy);
      }
      #login form {
        background: #fff;
        padding: 30px;
        border-radius: 16px;
        width: min(380px, 92vw);
      }
      dialog {
        border: 0;
        border-radius: 14px;
        padding: 22px;
        max-width: 380px;
      }
      dialog::backdrop {
        background: rgba(10, 22, 64, .5);
      }
      @media (max-width: 760px) {
        .two,
        .g {
          grid-template-columns: 1fr;
        }
        .vr {
          grid-template-columns: 1fr 1fr 70px 36px;
        }
        header span {
          display: none;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        * {
          transition: none !important;
        }
      }


      #view > * { animation: in .45s both; }
      .cards .k:nth-child(2) { animation-delay: .06s; } .cards .k:nth-child(3) { animation-delay: .12s; }
      .cards .k:nth-child(4) { animation-delay: .18s; } .cards .k:nth-child(5) { animation-delay: .24s; } .cards .k:nth-child(6) { animation-delay: .3s; }
      .k, .panel { transition: transform .25s, box-shadow .25s; }
      .k:hover, .panel:hover { transform: translateY(-3px); box-shadow: 0 14px 30px -16px rgba(10, 22, 64, .35); }
      @keyframes in { from { opacity: 0; translate: 0 14px; } }
      @media (prefers-reduced-motion: reduce) { #view > *, .k { animation: none !important; } }
      .sw { position: relative; display: inline-block; width: 44px; height: 24px; margin: 0; }
      .sw input { position: absolute; inset: 0; width: 100%; height: 100%; margin: 0; padding: 0; border: 0; opacity: 0; cursor: pointer; z-index: 1; }
      .sw i { position: absolute; inset: 0; background: #cdd4ea; border-radius: 99px; transition: background .25s; }
      .sw i::after { content: ""; position: absolute; top: 3px; left: 3px; width: 18px; height: 18px; background: #fff; border-radius: 50%; transition: transform .25s; }
      .sw input:checked + i { background: var(--blue); }
      .sw input:checked + i::after { transform: translateX(20px); }
      .sw input:focus-visible + i { outline: 3px solid var(--blue); outline-offset: 2px; }
      .pv { margin: 12px 0; color: var(--mut); }
      .pv s { color: #888; }
      input, select, textarea { font-size: 16px; } /* evita zoom automático no celular */
    </style>
  </head>
  <body>
    <div id="login">
      <form id="lf">
        <h1 style="font-size:36px;color:var(--navy)">Painel Dodô Esportes</h1>
        <p id="lmsg" style="color:var(--mut)">Acesso restrito à equipe da loja.</p>
        <label for="em">E-mail</label> <input id="em" type="email" autocomplete="username" required><label for="pw" id="pwl">Senha</label> <input id="pw" type="password" autocomplete="current-password" required minlength="8">
        <button class="btn" style="width:100%;margin-top:16px">Entrar</button>
        <button type="button" id="fg" class="btn s" style="width:100%;margin-top:8px">Esqueci minha senha</button>
      </form>
    </div>
    <div id="app" hidden>
      <header>
        <button class="ib" id="burger" aria-label="Menu" aria-expanded="false">☰</button>
        <h3>Dodô Esportes</h3>
        <button class="ib" id="bell" aria-label="Alertas de estoque">🔔<span class="bd" id="bn"></span></button><span id="who"></span>
        <button class="btn s" id="out">Sair</button>
      </header>
      <aside id="side">
      </aside>
      <div id="ov">
      </div>
      <main id="view">
      </main>
    </div>
    <dialog id="cf">
      <p id="cft" style="margin-bottom:16px"></p>
      <div style="display:flex;gap:8px;justify-content:flex-end">
        <button class="btn s" value="n">Cancelar</button>
        <button class="btn d" value="y">Excluir</button>
      </div>
    </dialog>
    <div id="toast" role="status">
    </div>
    <script type="module">
      import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/+esm";
      import { CFG } from "./config.js";
      const $ = (s) => document.querySelector(s), esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
      const brl = (n) => Number(n).toLocaleString("pt-BR", { style: "currency", currency: "BRL" });
      const toast = (m, ok = true) => {
        const t = $("#toast");
        t.textContent = m;
        t.style.background = ok ? "#0a7a35" : "#c0392b";
        t.style.display = "block";
        setTimeout(() => t.style.display = "none", 3500);
      };
      const ask = (m) => new Promise((r) => {
        $("#cft").textContent = m;
        const d = $("#cf");
        d.returnValue = "";
        d.onclose = () => r(d.returnValue === "y");
        d.showModal();
      });
      $("#cf").addEventListener("click", (e) => {
        if (e.target.value) $("#cf").close(e.target.value);
      });
      if (!CFG.SUPABASE_URL) {
        $("#lmsg").textContent = "Configure o Supabase em config.js (veja o README).";
      }
      const sb = createClient(CFG.SUPABASE_URL || "https://x.supabase.co", CFG.SUPABASE_ANON_KEY || "x");
      let D = { cats: [], prods: [], set: {} }, tries = 0, lock = 0, user = null;
      const tot = (p) => p.variants.reduce((a, v) => a + v.qty, 0);
      const status = (p) => !p.active ? ["off", "Inativo"] : tot(p) <= 0 ? ["no", "Esgotado"] : tot(p) <= p.min_stock ? ["lo", "Estoque baixo"] : ["ok", "Disponível"];
      const badge = (p) => {
        const s = status(p);
        return `<span class="st ${s[0]}">${s[1]}</span>`;
      };
      const MENU = [["dash", "Dashboard"], ["add", "Adicionar produtos"], ["list", "Gerenciar produtos"], ["cats", "Categorias"], ["promo", "Ofertas e promoções"], ["stock", "Controle de estoque"], ["cfg", "Configurações"]];
      $("#side").innerHTML = MENU.map((m) => `<button data-v="${m[0]}">${m[1]}</button>`).join("") + '<button id="so">Sair da conta</button>';
      const menu = (o) => {
        $("#side").classList.toggle("open", o);
        $("#ov").classList.toggle("show", o);
        $("#burger").setAttribute("aria-expanded", o);
      };
      $("#burger").onclick = () => menu(!$("#side").classList.contains("open"));
      $("#ov").onclick = () => menu(false);
      $("#side").onclick = (e) => {
        const b = e.target.closest("button");
        if (!b) return;
        if (b.id === "so") return logout();
        show(b.dataset.v);
        menu(false);
      };
      async function logout() {
        await sb.auth.signOut();
        location.reload();
      }
      $("#out").onclick = logout;
      $("#lf").onsubmit = async (e) => {
        e.preventDefault();
        if (recovery) {
          const { error: error2 } = await sb.auth.updateUser({ password: $("#pw").value });
          if (error2) return toast("Senha inválida ou link expirado.", false);
          toast("Senha alterada.");
          return enter();
        }
        if (Date.now() < lock) return toast("Muitas tentativas. Aguarde 1 minuto.", false);
        const { error } = await sb.auth.signInWithPassword({ email: $("#em").value.trim(), password: $("#pw").value });
        if (error) {
          if (++tries >= 5) {
            lock = Date.now() + 6e4;
            tries = 0;
          }
          return toast("E-mail ou senha incorretos.", false);
        }
        tries = 0;
        enter();
      };
      $("#fg").onclick = async () => {
        const m = $("#em").value.trim();
        if (!m) return toast("Digite seu e-mail.", false);
        await sb.auth.resetPasswordForEmail(m, { redirectTo: location.origin + location.pathname });
        toast("Se o e-mail estiver cadastrado, enviaremos o link.");
      };
      let recovery = false;
      sb.auth.onAuthStateChange((ev) => {
        if (ev === "PASSWORD_RECOVERY") {
          recovery = true;
          $("#lmsg").textContent = "Defina sua nova senha.";
          $("#em").closest("form").querySelectorAll("#em,label[for=em],#fg").forEach((x) => x.style.display = "none");
          $("#pwl").textContent = "Nova senha";
          $("#pw").autocomplete = "new-password";
        }
      });
      async function enter() {
        const { data: { session } } = await sb.auth.getSession();
        if (!session) return;
        const { data } = await sb.from("admins").select("user_id").eq("user_id", session.user.id).maybeSingle();
        if (!data) {
          await sb.auth.signOut();
          return toast("Esta conta não tem permissão de administrador.", false);
        }
        user = session.user;
        $("#who").textContent = user.email;
        $("#login").hidden = true;
        $("#app").hidden = false;
        await load();
        show("dash");
      }
      async function load() {
        const [c, p, s] = await Promise.all([sb.from("categories").select("*").order("sort"), sb.from("products").select("*,categories(name),product_images(id,path,sort),variants(id,size,color,qty)").order("created_at", { ascending: false }), sb.from("store_settings").select("*")]);
        if (c.error || p.error) return toast("Erro ao carregar dados.", false);
        D.cats = c.data;
        D.prods = p.data;
        D.set = {};
        s.data.forEach((x) => D.set[x.key] = x.value);
        const n = D.prods.filter((p2) => ["lo", "no"].includes(status(p2)[0])).length;
        $("#bn").textContent = n || "";
      }
      const V = $("#view");
      function show(v, arg) {
        V.onclick = (e) => {
          const g = e.target.closest("[data-go]");
          if (g) show(g.dataset.go);
        };
        document.querySelectorAll("#side button").forEach((b) => b.classList.toggle("on", b.dataset.v === v));
        ({ dash, add: () => form(), edit: () => form(arg), list, cats, promo, stock, cfg })[v]();
        scrollTo(0, 0);
      }
      $("#bell").onclick = () => show("stock");
      function dash() {
        const P = D.prods, a = P.filter((p) => p.active), pr = P.filter((p) => p.promo_price), lo = P.filter((p) => status(p)[0] === "lo"), no = P.filter((p) => status(p)[0] === "no");
        const k = [["Produtos", P.length], ["Categorias", D.cats.length], ["Ativos", a.length], ["Em promoção", pr.length], ["Estoque baixo", lo.length], ["Esgotados", no.length]];
        const by = D.cats.map((c) => [c.name, P.filter((p) => p.category_id === c.id).length]), mx = Math.max(1, ...by.map((x) => x[1]));
        V.innerHTML = `<div style="display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap"><h1>Dashboard</h1><button class="btn" data-go="add">Adicionar produto</button></div>
       <div class="cards">${k.map((x) => `<div class="k">${x[0]}<b>${x[1]}</b></div>`).join("")}</div>
       <div class="two"><div class="panel"><h3>Produtos por categoria</h3>${by.map((x) => `<div class="bar"><span style="width:130px;font-size:13px">${esc(x[0])}</span><i style="width:${x[1] / mx * 60}%;min-width:4px"></i><b>${x[1]}</b></div>`).join("") || "<p>Nenhuma categoria.</p>"}</div>
       <div class="panel"><h3>Alertas de estoque</h3>${[...no, ...lo].map((p) => `<p>${esc(p.name)} ${badge(p)} <small>(${tot(p)} un.)</small></p>`).join("") || "<p>Nenhum alerta.</p>"}</div></div>
       <div class="panel"><h3>Últimos cadastrados</h3>${P.slice(0, 5).map((p) => `<p>${esc(p.name)} — ${brl(p.price)} ${badge(p)}</p>`).join("") || "<p>Cadastre o primeiro produto para começar.</p>"}</div>
       <div class="panel"><h3>Acessos rápidos</h3><button class="btn s" data-go="list">Gerenciar produtos</button> <button class="btn s" data-go="stock">Estoque</button> <button class="btn s" data-go="promo">Promoções</button></div>`;
      }
      V.onclick = (e) => {
        const g = e.target.closest("[data-go]");
        if (g) show(g.dataset.go);
      };
      function list() {
        V.innerHTML = `<h1>Gerenciar produtos</h1>
          <div class="panel">
            <input id="ls" placeholder="Pesquisar produto" aria-label="Pesquisar">
            <p style="margin:8px 0;color:var(--mut)">Use os botões para ativar, destacar ou marcar como lançamento. A mudança vale na hora, sem abrir o produto.</p>
            <table>
              <thead><tr><th>Produto<th>Preço<th>Estoque<th>Status<th>Ativo<th>Destaque<th>Lançamento<th></thead>
              <tbody id="lb"></tbody>
            </table>
          </div>`;
        const sw = (p, k, nome) => `<label class="sw"><input type="checkbox" data-t="${k}" data-id="${p.id}" ${p[k] ? "checked" : ""} aria-label="${nome}: ${esc(p.name)}"><i></i></label>`;
        const r = () => {
          const q = $("#ls").value.toLowerCase();
          $("#lb").innerHTML = D.prods.filter((p) => p.name.toLowerCase().includes(q)).map((p) => `<tr>
            <td>${esc(p.name)}<td>${brl(p.price)}<td>${tot(p)}<td>${badge(p)}
            <td>${sw(p, "active", "Ativo")}<td>${sw(p, "featured", "Destaque")}<td>${sw(p, "is_new", "Lançamento")}
            <td><button class="btn s" data-e="${p.id}">Editar</button> <button class="btn d" data-d="${p.id}">Excluir</button></tr>`).join("") || "<tr><td colspan=8>Nenhum produto.</tr>";
        };
        r();
        $("#ls").oninput = r;
        const nomes = { active: ["Produto ativado.", "Produto desativado."], featured: ["Produto em destaque.", "Produto removido dos destaques."], is_new: ["Marcado como lançamento.", "Removido de lançamentos."] };
        $("#lb").onchange = async (e) => {
          const c = e.target;
          if (!c.dataset.t) return;
          const { error } = await sb.from("products").update({ [c.dataset.t]: c.checked }).eq("id", c.dataset.id);
          if (error) { c.checked = !c.checked; return toast("Não foi possível alterar.", false); }
          toast(nomes[c.dataset.t][c.checked ? 0 : 1]);
          await load();
          r();
        };
        $("#lb").onclick = async (e) => {
          const b = e.target.closest("button");
          if (!b) return;
          if (b.dataset.e) return show("edit", b.dataset.e);
          const p = D.prods.find((x) => x.id === b.dataset.d);
          if (!await ask(`Excluir "${p.name}"? Esta ação não pode ser desfeita.`)) return;
          if (p.product_images.length) await sb.storage.from("product-images").remove(p.product_images.map((i) => i.path));
          const { error } = await sb.from("products").delete().eq("id", p.id);
          if (error) return toast("Não foi possível excluir.", false);
          toast("Produto excluído.");
          await load();
          list();
        };
      }
      function vrow(v = {}) {
        return `<div class="vr"><input placeholder="Tamanho" value="${esc(v.size || "Único")}" maxlength="20" aria-label="Tamanho"><input placeholder="Cor" value="${esc(v.color || "Único")}" maxlength="30" aria-label="Cor"><input type="number" min="0" step="1" value="${v.qty ?? 0}" aria-label="Quantidade"><button type="button" class="btn d" data-rv aria-label="Remover">×</button></div>`;
      }
      function form(id) {
        const p = id ? D.prods.find((x) => x.id === id) : null, u = p || { variants: [{}], product_images: [] };
        V.innerHTML = `<h1>${p ? "Editar produto" : "Adicionar produto"}</h1><form class="panel" id="pf"><div class="g"><div><label>Nome</label><input name="name" required minlength="2" maxlength="120" value="${esc(p?.name)}"></div><div><label>Marca</label><input name="brand" maxlength="60" value="${esc(p?.brand)}"></div>
       <div><label>Categoria</label><select name="cat"><option value="">Sem categoria</option>${D.cats.map((c) => `<option value="${c.id}" ${p?.category_id === c.id ? "selected" : ""}>${esc(c.name)}</option>`).join("")}</select></div>
       <div><label>Estoque mínimo</label><input name="min" type="number" min="0" step="1" required value="${p?.min_stock ?? 2}"></div>
